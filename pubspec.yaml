name: nero_music
description: Nero Music - Your Music. Your World. Listen, Store, Share and Earn.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/nero_music_launcher.png
  adaptive_icon_background: "#E92727"
  adaptive_icon_foreground: assets/nero_music_launcher.png
  min_sdk_android: 21
