name: nero_music
description: Nero Music - Your Music. Your World. Listen, Store, Share and Earn.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.10.0
  shared_preferences: ^2.5.3
  just_audio: ^0.9.46

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/nero_music_launcher.png
    - assets/nero_music_banner.webp
    - assets/nero_profile_photo.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/nero_music_launcher.png
  adaptive_icon_background: "#E92727"
  adaptive_icon_foreground: assets/nero_music_launcher.png
  min_sdk_android: 21
