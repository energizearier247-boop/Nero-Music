
name: Build Nero Music Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nero Music Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate Android files only if they do not already exist.
      - name: Generate Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.neromusic \
              --project-name nero_music .
          else
            echo "Existing Android project preserved."
          fi

      # Ensure the installed Android app can access the internet.
      - name: Configure Android network permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not found.")

          content = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
          ]

          for permission in permissions:
              declaration = (
                  f'<uses-permission android:name="{permission}"/>'
              )

              if permission not in content:
                  content = content.replace(
                      "<application",
                      f"    {declaration}\n    <application",
                      1
                  )

          if "<application" not in content:
              raise SystemExit(
                  "Could not find application element in manifest."
              )

          manifest.write_text(content)

          print("Android network permissions configured.")
          PY

      - name: Set exact launcher name
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Nero Music"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Format Dart files
        run: dart format lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "Nero Music APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nero-music-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
